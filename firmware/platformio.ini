[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11
lib_deps = adafruit/Adafruit PWM Servo Driver Library@3.0.2
extra_scripts = pre:pack_web.py
build_src_filter = +<main.cpp>

[env:i2c_check]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:pack_web.py
build_src_filter = +<i2c_check.cpp>

[env:servo_bench]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit PWM Servo Driver Library@3.0.2
extra_scripts = pre:pack_web.py
build_src_filter = +<servo_bench.cpp>

[env:leg_bench]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit PWM Servo Driver Library@3.0.2
extra_scripts = pre:pack_web.py
build_src_filter = +<leg_bench.cpp>

[env:batch_center]
extends = env:leg_bench
build_src_filter = +<batch_center.cpp>

[env:six_leg_setup]
extends = env:leg_bench
build_src_filter = +<six_leg_setup.cpp>
upload_speed = 115200
